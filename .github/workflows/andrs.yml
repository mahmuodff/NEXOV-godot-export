name: Build Android Export Templates Only

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_android_templates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCONSFLAGS: verbose=yes warnings=all use_lto=yes
      ANDROID_HOME: /usr/local/lib/android/sdk
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Set up Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone latest stable Godot source into ./godot
        run: |
          # أحدث tag مستقر بدون GitHub API (الـ API يرفض أحيانا بسبب rate limit فيرجع TAG فاضي)
          TAG=$(git ls-remote --tags --refs https://github.com/godotengine/godot.git '*-stable' | awk -F/ '{print $3}' | sort -V | tail -n1)
          echo "Latest stable tag: $TAG"
          test -n "$TAG"
          echo "GODOT_TAG=$TAG" >> $GITHUB_ENV
          git clone --depth 1 --branch "$TAG" https://github.com/godotengine/godot.git godot

      - name: Download AES-256 secure script
        run: |
          curl -L -o aes_secure.py "https://raw.githubusercontent.com/KnifeXRage/Godot-Secure/main/Godot%20Secure%20AES-256.py"

      - name: Patch AES script for non-interactive use
        run: |
          sed -i 's/confirm = input(.*/confirm = "yes"/' aes_secure.py
          sed -i '/exit(/d' aes_secure.py

      - name: Run AES-256 secure script (non-interactive)
        run: |
          python3 aes_secure.py ./godot || true

      - name: Apply custom branding (replace default Godot icons)
        run: |
          if [ -f branding/logo.png ]; then
            sudo apt-get install -y python3-pil python3-numpy
            cat << 'PYEOF' > make_branding.py
          #!/usr/bin/env python3
          """Generate Android launcher/splash branding from ONE logo image and drop it
          into a Godot source tree (replaces the default Godot icons)."""
          import os, sys
          import numpy as np
          from PIL import Image, ImageFilter

          godot, logo_path = sys.argv[1], sys.argv[2]
          RES = os.path.join(godot, "platform/android/java/lib/src/main/res")
          MAIN = os.path.join(godot, "main")

          src = Image.open(logo_path).convert("RGB")
          W, H = src.size
          a = np.asarray(src).astype(np.float32)

          # --- 1) cut the glyph out of the dark background (luminance key) -----------
          BG = (1, 6, 22)                      # background layer colour (matches logo bg)
          mx = a.max(axis=2)
          alpha = np.clip((mx - 90.0) / (150.0 - 90.0), 0, 1)
          alpha = alpha * alpha * (3 - 2 * alpha)                      # smoothstep
          # ignore the rounded frame + side glow: keep only the inner glyph area
          m = np.zeros_like(alpha)
          x0, x1, y0, y1 = int(.17 * W), int(.865 * W), int(.092 * H), int(.82 * H)
          m[y0:y1, x0:x1] = 1
          alpha *= m
          # drop isolated specks (opening, then generous dilation to keep soft edges)
          core = Image.fromarray(((alpha > 0.5) * 255).astype(np.uint8)).filter(ImageFilter.MinFilter(3)).filter(ImageFilter.MaxFilter(9))
          alpha *= (np.asarray(core) > 0)
          rgb = np.where(alpha[..., None] > 0.02, a / np.maximum(alpha[..., None], 0.02), 0)
          rgb = np.clip(rgb, 0, 255).astype(np.uint8)
          glyph = Image.fromarray(np.dstack([rgb, (alpha * 255).astype(np.uint8)]), "RGBA")
          bbox = glyph.getchannel("A").point(lambda v: 255 if v > 40 else 0).getbbox()
          glyph = glyph.crop(bbox)
          gw, gh = glyph.size

          # --- 2) scale so the glyph fits the adaptive-icon safe zone ----------------
          # 432px canvas, visible circle radius 144px, keep everything within ~134px
          al = np.asarray(glyph.getchannel("A")) > 90
          ys, xs = np.nonzero(al)
          cx, cy = (xs.min() + xs.max()) / 2, (ys.min() + ys.max()) / 2
          rmax = np.sqrt((xs - cx) ** 2 + (ys - cy) ** 2).max()
          scale = 134.0 / rmax
          FG = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          g = glyph.resize((max(1, round(gw * scale)), max(1, round(gh * scale))), Image.LANCZOS)
          FG.alpha_composite(g, (round(216 - cx * scale), round(216 - cy * scale)))
          BGI = Image.new("RGBA", (432, 432), BG + (255,))
          # monochrome (alpha only is used by Android) - solid silhouette
          ma = FG.getchannel("A").filter(ImageFilter.MaxFilter(3)).point(lambda v: min(255, int(v * 2.2)))
          MONO = Image.merge("RGBA", (Image.new("L", FG.size, 255),) * 3 + (ma,))
          # legacy full-colour icon = the whole logo
          MAIN_ICON = src.convert("RGBA")

          def save(img, path, size, lossless=True):
              d = os.path.dirname(path)
              if not os.path.isdir(d):
                  print("::warning::missing dir", d); return
              img.resize((size, size), Image.LANCZOS).save(path, "WEBP", lossless=lossless, quality=100, method=6)
              print("wrote", os.path.relpath(path, godot), size)

          DPI = {"mipmap-mdpi": (48, 108), "mipmap-hdpi": (72, 162), "mipmap-xhdpi": (96, 216),
                 "mipmap-xxhdpi": (144, 324), "mipmap-xxxhdpi": (192, 432), "mipmap": (192, 108)}
          for d, (legacy, ad) in DPI.items():
              p = os.path.join(RES, d)
              save(MAIN_ICON, f"{p}/icon.webp", legacy)
              save(FG, f"{p}/icon_foreground.webp", ad)
              save(BGI, f"{p}/icon_background.webp", ad)
              save(MONO, f"{p}/icon_monochrome.webp", ad)
          save(FG, os.path.join(RES, "drawable/splash_icon.webp"), 432)

          # --- 3) engine default boot splash (800x600) + window icon -----------------
          if os.path.isdir(MAIN):
              sp = Image.new("RGBA", (800, 600), (0, 0, 0, 0))
              logo = MAIN_ICON.resize((380, 380), Image.LANCZOS)
              sp.alpha_composite(logo, (210, 110))
              sp.save(os.path.join(MAIN, "splash.png"))
              MAIN_ICON.resize((128, 128), Image.LANCZOS).save(os.path.join(MAIN, "app_icon.png"))
              print("wrote main/splash.png, main/app_icon.png")

          # previews (optional) -------------------------------------------------------
          if len(sys.argv) > 3:
              from PIL import ImageDraw
              out = sys.argv[3]; os.makedirs(out, exist_ok=True)
              comp = Image.alpha_composite(BGI, FG)
              def mask(shape):
                  v = comp.crop((54, 54, 378, 378)); mm = Image.new("L", v.size, 0); dd = ImageDraw.Draw(mm)
                  (dd.ellipse((0, 0, v.width - 1, v.height - 1), fill=255) if shape == "circle"
                   else dd.rounded_rectangle((0, 0, v.width - 1, v.height - 1), 70, fill=255))
                  o = Image.new("RGBA", v.size, (40, 40, 44, 255)); o.paste(v, (0, 0), mm); return o
              sheet = Image.new("RGBA", (324 * 3 + 80, 340), (40, 40, 44, 255))
              sheet.paste(mask("circle"), (20, 8)); sheet.paste(mask("round"), (364, 8))
              sheet.paste(MAIN_ICON.resize((324, 324)), (708, 8)); sheet.convert("RGB").save(f"{out}/preview.png")

          PYEOF
            python3 -I make_branding.py ./godot branding/logo.png
          else
            echo "::warning::branding/logo.png not found - default Godot icons kept"
          fi

      - name: Install Dependencies & Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config python3 zip unzip curl git
          NDK_VER=$(grep -oP "ndkVersion\s*:\s*'\K[^']+" godot/platform/android/java/app/config.gradle)
          BT_VER=$(grep -oP "buildTools\s*:\s*'\K[^']+" godot/platform/android/java/app/config.gradle)
          SDK_VER=$(grep -oP "compileSdk\s*:\s*\K[0-9]+" godot/platform/android/java/app/config.gradle)
          echo "NDK=$NDK_VER BuildTools=$BT_VER SDK=$SDK_VER"
          test -n "$NDK_VER"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VER}" "cmake;3.22.1" "build-tools;${BT_VER}" "platforms;android-${SDK_VER}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VER}" >> $GITHUB_ENV

      - name: Build Android Export Templates (arm32 + arm64, Release & Debug)
        run: |
          cd godot
          # --- 32-bit (armeabi-v7a) ---
          scons platform=android target=template_release arch=arm32 -j$(nproc)
          scons platform=android target=template_debug   arch=arm32 -j$(nproc)
          # --- 64-bit (arm64-v8a) ---
          scons platform=android target=template_release arch=arm64 -j$(nproc)
          # آخر أمر مع generate_android_binaries=yes يجمع كل المعماريات في APK/AAR واحد
          scons platform=android target=template_debug   arch=arm64 -j$(nproc) generate_android_binaries=yes
          ls -la bin/

      - name: Package Android Templates
        run: |
          # اسم الإصدار بصيغة version.txt مثل 4.4.1.stable
          VER=$(echo "$GODOT_TAG" | sed 's/-/./')
          mkdir -p tpz/templates
          cp godot/bin/android_release.apk godot/bin/android_debug.apk godot/bin/android_source.zip tpz/templates/
          echo "$VER" > tpz/templates/version.txt
          (cd tpz && zip -9 -r ../android_export_templates.tpz templates)

      - name: Upload Android templates artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-export-templates
          path: |
            android_export_templates.tpz
            godot/bin/android_*.apk
            godot/bin/android_source.zip
