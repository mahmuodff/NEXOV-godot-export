name: Build Android Export Templates Only

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_android_templates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCONSFLAGS: verbose=yes warnings=all use_lto=yes
      ANDROID_HOME: /usr/local/lib/android/sdk
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Set up Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone latest stable Godot source into ./godot
        run: |
          # أحدث tag مستقر بدون GitHub API (الـ API يرفض أحيانا بسبب rate limit فيرجع TAG فاضي)
          TAG=$(git ls-remote --tags --refs https://github.com/godotengine/godot.git '*-stable' | awk -F/ '{print $3}' | sort -V | tail -n1)
          echo "Latest stable tag: $TAG"
          test -n "$TAG"
          echo "GODOT_TAG=$TAG" >> $GITHUB_ENV
          git clone --depth 1 --branch "$TAG" https://github.com/godotengine/godot.git godot

      - name: Download AES-256 secure script
        run: |
          curl -L -o aes_secure.py "https://raw.githubusercontent.com/KnifeXRage/Godot-Secure/main/Godot%20Secure%20AES-256.py"

      - name: Patch AES script for non-interactive use
        run: |
          sed -i 's/confirm = input(.*/confirm = "yes"/' aes_secure.py
          sed -i '/exit(/d' aes_secure.py

      - name: Run AES-256 secure script (non-interactive)
        run: |
          python3 aes_secure.py ./godot || true

      - name: Install Dependencies & Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config python3 zip unzip curl git
          NDK_VER=$(grep -oP "ndkVersion\s*:\s*'\K[^']+" godot/platform/android/java/app/config.gradle)
          BT_VER=$(grep -oP "buildTools\s*:\s*'\K[^']+" godot/platform/android/java/app/config.gradle)
          SDK_VER=$(grep -oP "compileSdk\s*:\s*\K[0-9]+" godot/platform/android/java/app/config.gradle)
          echo "NDK=$NDK_VER BuildTools=$BT_VER SDK=$SDK_VER"
          test -n "$NDK_VER"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VER}" "cmake;3.22.1" "build-tools;${BT_VER}" "platforms;android-${SDK_VER}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VER}" >> $GITHUB_ENV

      - name: Build Android Export Templates (arm32 + arm64, Release & Debug)
        run: |
          cd godot
          # --- 32-bit (armeabi-v7a) ---
          scons platform=android target=template_release arch=arm32 -j$(nproc)
          scons platform=android target=template_debug   arch=arm32 -j$(nproc)
          # --- 64-bit (arm64-v8a) ---
          scons platform=android target=template_release arch=arm64 -j$(nproc)
          # آخر أمر مع generate_android_binaries=yes يجمع كل المعماريات في APK/AAR واحد
          scons platform=android target=template_debug   arch=arm64 -j$(nproc) generate_android_binaries=yes
          ls -la bin/

      - name: Package Android Templates
        run: |
          # اسم الإصدار بصيغة version.txt مثل 4.4.1.stable
          VER=$(echo "$GODOT_TAG" | sed 's/-/./')
          mkdir -p tpz/templates
          cp godot/bin/android_release.apk godot/bin/android_debug.apk godot/bin/android_source.zip tpz/templates/
          echo "$VER" > tpz/templates/version.txt
          (cd tpz && zip -9 -r ../android_export_templates.tpz templates)

      - name: Upload Android templates artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-export-templates
          path: |
            android_export_templates.tpz
            godot/bin/android_*.apk
            godot/bin/android_source.zip
