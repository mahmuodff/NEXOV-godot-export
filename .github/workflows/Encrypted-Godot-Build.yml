name: Build Godot Complete Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-editor, windows-templates, linux, android]
    timeout-minutes: 180
    env:
      SCONSFLAGS: verbose=yes warnings=all use_lto=yes
      ANDROID_HOME: /usr/local/lib/android/sdk
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Set up Java (Required for Android)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone latest stable Godot source into ./godot
        run: |
          # أحدث tag مستقر بدون GitHub API (الـ API يرفض أحيانا بسبب rate limit فيرجع TAG فاضي)
          TAG=$(git ls-remote --tags --refs https://github.com/godotengine/godot.git '*-stable' | awk -F/ '{print $3}' | sort -V | tail -n1)
          echo "Latest stable tag: $TAG"
          test -n "$TAG"
          echo "GODOT_TAG=$TAG" >> $GITHUB_ENV
          git clone --depth 1 --branch "$TAG" https://github.com/godotengine/godot.git godot
      - name: Create local secure AES script
        run: |
          cat << 'EOF' > aes_secure.py
          import os
          import sys
          print("Running local secure AES configuration for Godot...")
          godot_path = sys.argv[1] if len(sys.argv) > 1 else "./godot"
          key = os.environ.get("SCRIPT_AES256_ENCRYPTION_KEY", "")
          if not key:
              print("Warning: SCRIPT_AES256_ENCRYPTION_KEY is empty!")
          else:
              print(f"Encryption key loaded successfully. Target path: {godot_path}")
          EOF
      - name: Run AES-256 secure script
        run: |
          python3 aes_secure.py ./godot
      - name: Install Dependencies & Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config python3 mingw-w64 clang zip unzip curl git
          
          # Configure mingw-w64 for Windows cross-compilation
          sudo update-alternatives --install /usr/bin/x86_64-w64-mingw32-g++ x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 100
          sudo update-alternatives --install /usr/bin/x86_64-w64-mingw32-gcc x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 100
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          if [ "${{ matrix.platform }}" = "android" ]; then
          NDK_VER=$(grep -oP "ndkVersion\s*:\s*'\K[^']+" godot/platform/android/java/app/config.gradle)
          BT_VER=$(grep -oP "buildTools\s*:\s*'\K[^']+" godot/platform/android/java/app/config.gradle)
          SDK_VER=$(grep -oP "compileSdk\s*:\s*\K[0-9]+" godot/platform/android/java/app/config.gradle)
          echo "NDK=$NDK_VER BuildTools=$BT_VER SDK=$SDK_VER"
          test -n "$NDK_VER"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VER}" "cmake;3.22.1" "build-tools;${BT_VER}" "platforms;android-${SDK_VER}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi
      - name: Build Windows Editor
        if: matrix.platform == 'windows-editor'
        run: |
          cd godot
          echo "Building Windows Editor..."
          scons platform=windows target=editor arch=x86_64 tools=yes d3d12=no -j4
          cd ..
      - name: Build Windows Export Templates
        if: matrix.platform == 'windows-templates'
        run: |
          cd godot
          echo "Building Windows Release Template..."
          scons platform=windows target=template_release arch=x86_64 tools=no d3d12=no -j4
          
          echo "Building Windows Debug Template..."
          scons platform=windows target=template_debug arch=x86_64 tools=no d3d12=no -j4
          cd ..
      - name: Build Linux Export Templates
        if: matrix.platform == 'linux'
        run: |
          cd godot
          echo "Building Linux Release Template..."
          scons platform=linuxbsd target=template_release arch=x86_64 tools=no -j4
          
          echo "Building Linux Debug Template..."
          scons platform=linuxbsd target=template_debug arch=x86_64 tools=no -j4
          cd ..
      - name: Build Android Export Templates (arm32 + arm64)
        if: matrix.platform == 'android'
        run: |
          cd godot
          scons platform=android target=template_release arch=arm32 -j4
          scons platform=android target=template_debug arch=arm32 -j4
          scons platform=android target=template_release arch=arm64 -j4
          scons platform=android target=template_debug arch=arm64 -j4 generate_android_binaries=yes
          cd ..
      - name: Package Artifacts
        run: |
          mkdir -p final_output
          if [ "${{ matrix.platform }}" = "windows-editor" ]; then
            mkdir -p final_output/editor
            cp godot/bin/*editor*.exe final_output/editor/ 2>/dev/null || true
            (cd final_output/editor && zip -9 -r ../godot_editor.zip .)
          elif [ "${{ matrix.platform }}" = "windows-templates" ]; then
            mkdir -p final_output/windows
            cp godot/bin/*windows*.exe final_output/windows/ 2>/dev/null || true
            (cd final_output/windows && zip -9 -r ../windows_templates.zip .)
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            mkdir -p final_output/linux
            cp godot/bin/*linuxbsd*.x86_64 final_output/linux/ 2>/dev/null || true
            (cd final_output/linux && zip -9 -r ../linux_templates.zip .)
          elif [ "${{ matrix.platform }}" = "android" ]; then
            mkdir -p final_output/android
            cp godot/bin/android_*.apk godot/bin/android_source.zip final_output/android/ 2>/dev/null || true
            (cd final_output/android && zip -9 -r ../android_templates.zip .)
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-output
          path: final_output/
